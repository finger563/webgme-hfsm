name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generator:
    name: Generator tests, golden diff, generated-code compile + trace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The full WebGME dependency tree is old and heavy; the
      # standalone generator + tests only need these packages.
      - name: Install generator dependencies
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          requirejs requirejs-text handlebars underscore mocha

      # `npm test` globs test/*.spec.js, so a spec added later runs
      # here without anyone remembering to list it
      - name: Run generator unit + golden tests
        run: npm test

      - name: Compile and trace-check golden generated code
        run: ./scripts/run_generated_tests.sh

      - name: CLI smoke test (generation + interop exports)
        run: |
          node bin/hfsm-gen.js test/fixtures/features.json \
            -o build/cli-smoke -t -e all
          test -f build/cli-smoke/Features_generated_states.cpp
          test -f build/cli-smoke/Features.scxml
          test -f build/cli-smoke/Features.puml
          test -f build/cli-smoke/Features.mmd

      - name: CLI smoke test (diff)
        run: |
          # The three exit statuses are the contract, so check for the
          # exact one each time: "non-zero" would accept 2, which is
          # what a crash or an unreadable file reports.
          check() {
            local want="$1"; shift
            set +e; "$@" > /dev/null; local got=$?; set -e
            if [ "$got" != "$want" ]; then
              echo "expected exit $want, got $got, from: $*"; exit 1
            fi
          }
          # the same machine
          check 0 node bin/hfsm-diff.js examples/Simple.json examples/Simple.json
          # a different one
          check 1 node bin/hfsm-diff.js examples/Simple.json examples/Medium.json
          # only the layout moved -- not a change, so still 0
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('examples/Simple.json','utf8'));
            Object.keys(m.objects).forEach(function (p) {
              if (m.objects[p].position) m.objects[p].position.x += 17;
            });
            fs.writeFileSync('/tmp/moved.json', JSON.stringify(m));
          "
          check 0 node bin/hfsm-diff.js examples/Simple.json /tmp/moved.json
          # and a broken input is not a difference
          echo '{ not json' > /tmp/bad.json
          check 2 node bin/hfsm-diff.js examples/Simple.json /tmp/bad.json

      - name: Validate SCXML export is well-formed XML
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --noout build/cli-smoke/Features.scxml

  samples:
    name: Compile and run sample_code
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # The Simple sample regenerates from its committed model; all
      # samples must build with their own Makefiles and exit cleanly
      # on end-of-input (regression check for the EOF spin bug).
      - name: Build samples
        run: |
          for d in Simple Medium Complex; do
            make -C "sample_code/$d" test debug
          done

      # `timeout` is not available on macOS runners; perl's alarm is
      # a portable hang-guard (the binaries must exit on EOF anyway)
      - name: Run samples with scripted input
        run: |
          with_timeout() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          printf '0\n' | with_timeout 10 sample_code/Simple/Simple_test_DEBUG
          printf '1\n' | with_timeout 10 sample_code/Medium/Medium_test_DEBUG
          printf '1\n2\n0\n' | with_timeout 10 sample_code/Complex/Complex_test_DEBUG

  deployment-config:
    name: Deployment config and devcontainer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # config.docker.js is loaded by webgme's config validator, so a
      # broken deployment config fails here rather than at deploy time
      - name: Install config dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts webgme

      - name: MONGO_URI is honored (cloud / Atlas deployments)
        env:
          NODE_ENV: docker
          MONGO_URI: "mongodb+srv://user:pass@cluster.example.mongodb.net/webgme_hfsm?retryWrites=true"
        run: |
          node -e "
            var c = require('./config');
            var expected = process.env.MONGO_URI;
            if (c.mongo.uri !== expected) {
              throw new Error('MONGO_URI ignored: ' + c.mongo.uri);
            }
            console.log('mongo.uri honors MONGO_URI');
          "

      - name: Falls back to the compose service hostname
        env:
          NODE_ENV: docker
        run: |
          node -e "
            var c = require('./config');
            if (c.mongo.uri !== 'mongodb://mongo:27017/webgme_hfsm') {
              throw new Error('unexpected fallback uri: ' + c.mongo.uri);
            }
            console.log('fallback uri ok');
          "

      # the documented `docker compose up -d --build` must work on a
      # FRESH checkout: without a build definition compose tries to
      # PULL the image and fails for anyone who has not built it
      - name: Base compose service builds the image locally
        run: |
          ctx=$(docker compose config --format json |
                jq -r '.services["webgme-hfsm"].build.context // empty')
          test -n "$ctx" || {
            echo "webgme-hfsm has no build definition: 'docker compose up --build'"
            echo "would try to PULL the image and fail on a fresh checkout"
            exit 1
          }
          test -f "$ctx/Dockerfile"
          echo "base build context: $ctx"

      # boot the real stack: this exercises component startup
      # (including the UIRecorder router, which carries its own older
      # MongoDB driver) rather than only checking config resolution
      - name: Compose stack boots and serves
        run: |
          docker compose up -d --build
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "http: $code"
          docker compose logs webgme-hfsm > /tmp/server.log 2>&1 || true
          test "$code" = "200" || { tail -40 /tmp/server.log; exit 1; }
          grep -q "Server is listening" /tmp/server.log
          # no component (e.g. UIRecorder) may fail during startup
          if grep -niE "uirecorder.*(error|fail)" /tmp/server.log; then
            echo "UIRecorder reported an error during startup"; exit 1
          fi
          docker compose down -v

      # the same boot, but driven through MONGO_URI -- the variable
      # cloud deployments set (and which UIRecorder also receives)
      - name: Compose stack boots with MONGO_URI set
        run: |
          cat > /tmp/mongo-uri-override.yml <<'YAML'
          services:
            webgme-hfsm:
              environment:
                - "NODE_ENV=docker"
                - "MONGO_URI=mongodb://mongo:27017/webgme_hfsm_citest"
          YAML
          docker compose -f docker-compose.yml -f /tmp/mongo-uri-override.yml up -d --build
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "http: $code"
          docker compose -f docker-compose.yml -f /tmp/mongo-uri-override.yml \
            logs webgme-hfsm > /tmp/server-uri.log 2>&1 || true
          test "$code" = "200" || { tail -40 /tmp/server-uri.log; exit 1; }
          grep -q "webgme_hfsm_citest" /tmp/server-uri.log
          if grep -niE "uirecorder.*(error|fail)" /tmp/server-uri.log; then
            echo "UIRecorder reported an error during startup"; exit 1
          fi
          docker compose -f docker-compose.yml -f /tmp/mongo-uri-override.yml down -v

      - name: Devcontainer compose files merge and resolve
        run: |
          # relative paths in extra -f files resolve against the FIRST
          # file's directory (a common footgun): assert the build
          # context still lands inside the repo
          ctx=$(docker compose -f docker-compose.yml \
                  -f .devcontainer/docker-compose.devcontainer.yml \
                  config --format json |
                jq -r '.services["webgme-hfsm"].build.context')
          echo "build context: $ctx"
          test -f "$ctx/Dockerfile"

      - name: Devcontainer metadata is well formed
        run: |
          # devcontainer.json permits // comments; strip them for jq
          grep -v '^[[:space:]]*//' .devcontainer/devcontainer.json > /tmp/devcontainer.json
          jq -e '.service == "webgme-hfsm"' /tmp/devcontainer.json > /dev/null
          jq -e '.forwardPorts | index(8081) != null' /tmp/devcontainer.json > /dev/null
          echo "devcontainer.json ok"

  web-playground:
    name: Static playground builds and matches the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install generator dependencies
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          requirejs requirejs-text handlebars underscore

      # The playground ships the visualizer, so it needs the same
      # front-end libraries WebGME serves -- at the SAME versions,
      # which is the point of vendoring them rather than picking
      # replacements. bower.json pins the cytoscape family; the rest
      # (jquery, bootstrap, require-css, font-awesome, q) come from
      # webgme's own dependencies, exactly as they do at runtime.
      - name: Install the visualizer's front-end libraries
        run: |
          npm install --no-save --no-package-lock --ignore-scripts webgme bower
          ./node_modules/.bin/bower install --allow-root

      - name: Build the playground
        run: ./scripts/build-web.sh

      # asserts the build is self-contained (no CDN assets) and that
      # the generator copied into it reproduces the goldens byte for
      # byte -- i.e. the playground cannot drift from the CLI
      - name: Verify the build
        run: node scripts/verify-web-build.js

      - name: Upload the playground
        uses: actions/upload-artifact@v4
        with:
          name: hfsm-playground
          path: dist/web

  meta-sync:
    name: Committed metamodel matches the WebGME meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # src/common/meta.json is generated from the WebGME metamodel by
      # hand (npm run gen:meta) and committed, so the CLI, the
      # playground and any non-WebGME backend can read the same rules
      # the editor enforces. It must not be edited directly or left
      # behind when the metamodel changes.
      #
      # check:meta also compares the copies inside src/seeds, which
      # are what actually govern a project at runtime -- so this is
      # exactly the command a contributor runs locally.
      - name: meta.json, meta.js and the seeds agree
        run: npm run check:meta

  regen-simple:
    name: Simple sample regenerates from its model (no drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install generator dependencies
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          requirejs requirejs-text handlebars underscore

      - name: Regenerate and diff
        run: |
          node bin/hfsm-gen.js sample_code/Simple/Simple_model.json \
            -o build/regen-simple -t
          for f in Simple_generated_states.hpp Simple_generated_states.cpp \
                   Simple_event_data.hpp Simple_test.cpp Makefile \
                   state_base.hpp deep_history_state.hpp \
                   shallow_history_state.hpp; do
            diff -u "sample_code/Simple/$f" "build/regen-simple/$f"
          done

  # The CLI has to work for someone who INSTALLS this package, which is
  # a different code path from the checkout every other job runs in:
  # npm hoists dependencies into the consumer's node_modules, so a
  # loader that only looks under its own directory finds nothing. That
  # is exactly how `npm install webgme-hfsm && hfsm-gen` came to fail
  # with "cannot find underscore" while all of CI stayed green.
  packaged-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Generate the reference output from the checkout, the way the
      # other jobs do.
      - name: Install generator dependencies
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          requirejs requirejs-text handlebars underscore

      - name: Generate from the checkout
        run: node bin/hfsm-gen.js examples/Complex.json -o build/from-checkout

      # Now do it the way a user would: pack, install the tarball into
      # an unrelated directory, and run the installed binary.
      - name: Pack and install as a dependency
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          echo '{"name":"consumer","version":"1.0.0"}' > package.json
          npm install --no-audit --no-fund /tmp/webgme-hfsm-*.tgz

      - name: The heavy optional peers must not be installed
        run: |
          cd /tmp/consumer
          for heavy in webgme webgme-codeeditor codemirror; do
            if [ -d "node_modules/$heavy" ]; then
              echo "$heavy was installed for a CLI-only consumer"; exit 1
            fi
          done

      - name: Generate from the installed package
        run: |
          cd /tmp/consumer
          cp $GITHUB_WORKSPACE/examples/Complex.json .
          ./node_modules/.bin/hfsm-gen Complex.json -o out
          ./node_modules/.bin/hfsm-diff Complex.json Complex.json

      # Same generator, same bytes -- the metadata carries a timestamp.
      - name: Installed output must match the checkout
        run: |
          diff -r --exclude=hfsm_metadata.json \
            build/from-checkout /tmp/consumer/out
